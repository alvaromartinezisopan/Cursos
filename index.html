<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isopan Academy - Dashboard</title>
    <style>
        :root {
            --isopan-gray-bg: #ffffff;
            --isopan-gray-card: #f8f8f8;
            --text-main: #1d1d1f;
            --text-secondary: #48484a;
            --apple-red: #ff3b30;
            --isopan-blue: #0084ad;
            --alert-orange: #ff9500;
            --alert-yellow: #ffcc00;
            --alert-weekday: #3a3a3c;
        }

        html, body {
            height: 100%; margin: 0; padding: 0;
            background-color: var(--isopan-gray-bg);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            overflow: hidden;
        }

        .main-wrapper {
            display: flex; flex-direction: column; justify-content: flex-end;
            height: 100vh; padding: 15px; box-sizing: border-box;
        }

        .grid-container { display: flex; flex-direction: column; gap: 12px; width: 100%; }

        #status-msg {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #86868b; font-size: 14px; text-align: center;
        }

        .course-card {
            background: var(--isopan-gray-card); border-radius: 16px;
            padding: 18px; display: flex; gap: 20px; position: relative;
            border: 1px solid #eeeeef;
        }

        .new-highlight { 
            border: 2px solid var(--isopan-blue); 
            background: #ffffff; 
        }

        .badges-wrapper {
            position: absolute;
            top: -10px;
            right: 20px;
            display: flex;
            gap: 6px;
            z-index: 10;
        }

        .badge-item {
            font-size: 9px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 20px;
            text-transform: uppercase;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .new-badge {
            background: var(--isopan-blue);
            color: white;
            box-shadow: 0 4px 8px rgba(0, 132, 173, 0.2);
        }

        .badge-hoy { background: var(--alert-orange); color: white; }
        .badge-manana { background: var(--alert-yellow); color: #1d1d1f; }
        .badge-semana { background: var(--alert-weekday); color: white; }

        .card-left { 
            flex: 0.8; 
            border-right: 1px solid #e5e5e7; 
            padding-right: 20px; 
        }
        
        .card-right { 
            flex: 1.2; 
            display: flex; 
            flex-direction: column; 
            padding-left: 15px; 
            padding-top: 5px; 
        }

        .category-label { font-size: 10px; font-weight: 700; color: var(--isopan-blue); text-transform: uppercase; margin-bottom: 4px; }
        .course-title { font-size: 20px; font-weight: 700; line-height: 1.2; margin: 0 0 12px 0; color: var(--text-main); }
        
        .sessions-wrapper { display: flex; flex-wrap: wrap; gap: 10px; }
        
        .session-group { display: flex; gap: 4px; } 
        .session-box { 
            background: #ffffff; 
            padding: 6px 12px; 
            border: 1px solid #e5e5e7; 
            display: flex; 
            align-items: center; 
        }
        .box-left { border-radius: 10px 4px 4px 10px; } 
        .box-right { border-radius: 4px 10px 10px 4px; } 

        .calendar-icon { display: flex; flex-direction: column; align-items: center; min-width: 32px; }
        .cal-month { font-size: 8px; font-weight: 800; color: var(--apple-red); text-transform: uppercase; }
        .cal-day { font-size: 16px; font-weight: 700; color: var(--text-main); }
        .time-info .value { font-size: 13px; font-weight: 600; }
        
        .right-label { font-size: 11px; font-weight: 800; color: var(--text-main); text-transform: uppercase; margin-bottom: 6px; }
        .location-box { margin-bottom: 18px; font-size: 13px; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; font-weight: 500; }
        .attendee-tag { background: #ffffff; padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 600; color: var(--text-secondary); border: 1px solid #e5e5e7; margin-right: 4px; margin-bottom: 4px; display: inline-block; }

        /* Contenedor e Indicadores de Página (Sin transiciones para 24Hz) */
        .page-indicators {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 15px;
            width: 100%;
            min-height: 10px;
        }
        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #d1d1d6;
        }
        .dot.active {
            background-color: var(--isopan-blue);
        }
    </style>
</head>
<body>

    <div id="status-msg"></div>

    <div class="main-wrapper">
        <div class="grid-container" id="course-grid"></div>
        <div class="page-indicators" id="indicators"></div>
    </div>

    <script>
        const url = `https://docs.google.com/spreadsheets/d/e/2PACX-1vQi8xUmy1GQ6y8KQ6wLtwnf5AX_g6GiMre33zIEw44gvW0EWurggC-g9S2kVqYq8ocvqloXPdhu6GMv/pub?output=csv`;
        
        // =========================================================
        //  AJUSTES DE CONFIGURACIÓN MODIFICABLES
        // =========================================================
        const cursosPorPagina = 2;     // Cuántos cursos caben en tu ventana de Yodeck
        const segundosPorPagina = 15;  // Tiempo de rotación por página (en segundos)
        const diasMaximosVista = 14;    // Filtro de días a futuro. Cámbialo a 10, 15, etc.
        // =========================================================

        let currentSnapshot = ""; 
        let allCourses = [];
        let currentPage = 0;
        let rotationInterval = null;

        function obtenerFechaObjeto(fechaStr) {
            if (!fechaStr || !fechaStr.includes('/')) return new Date(864000000000000);
            try {
                const partes = fechaStr.trim().split('/');
                const dia = parseInt(partes[0]);
                const mes = parseInt(partes[1]) - 1;
                const ahora = new Date();
                const anio = partes[2] ? parseInt(partes[2]) : ahora.getFullYear();
                return new Date(anio, mes, dia);
            } catch (e) { return new Date(864000000000000); }
        }

        function cursoYaTermino(fechaStr) {
            if (!fechaStr || !fechaStr.includes('/')) return false;
            try {
                const ahora = new Date();
                const partes = fechaStr.trim().split('/');
                const dia = parseInt(partes[0]);
                const mes = parseInt(partes[1]) - 1;
                const anio = partes[2] ? parseInt(partes[2]) : ahora.getFullYear();
                const finDelDia = new Date(anio, mes, dia, 23, 59, 59);
                return ahora > finDelDia;
            } catch (e) { return false; }
        }

        function obtenerEtiquetaDia(fechaStr) {
            if (!fechaStr || !fechaStr.includes('/')) return "";
            try {
                const ahora = new Date();
                const partes = fechaStr.trim().split('/');
                const dia = parseInt(partes[0]);
                const mes = parseInt(partes[1]) - 1;
                const anio = partes[2] ? parseInt(partes[2]) : ahora.getFullYear();
                
                const fechaCurso = new Date(anio, mes, dia);
                const hoy = new Date(ahora.getFullYear(), ahora.getMonth(), ahora.getDate());
                const manana = new Date(ahora.getFullYear(), ahora.getMonth(), ahora.getDate() + 1);

                if (fechaCurso.getTime() === hoy.getTime()) {
                    return `<div class="badge-item badge-hoy">HOY</div>`;
                } else if (fechaCurso.getTime() === manana.getTime()) {
                    return `<div class="badge-item badge-manana">MAÑANA</div>`;
                }

                const diaSemanaActual = hoy.getDay(); 
                const distanciaAlLunes = diaSemanaActual === 0 ? -6 : 1 - diaSemanaActual;
                
                const lunesDeEstaSemana = new Date(hoy);
                lunesDeEstaSemana.setDate(hoy.getDate() + distanciaAlLunes);
                
                const domingoDeEstaSemana = new Date(lunesDeEstaSemana);
                domingoDeEstaSemana.setDate(lunesDeEstaSemana.getDate() + 6);

                if (fechaCurso >= lunesDeEstaSemana && fechaCurso <= domingoDeEstaSemana) {
                    const diasNombre = ['DOMINGO', 'LUNES', 'MARTES', 'MIÉRCOLES', 'JUEVES', 'VIERNES', 'SÁBADO'];
                    const nombreDia = diasNombre[fechaCurso.getDay()];
                    return `<div class="badge-item badge-semana">${nombreDia}</div>`;
                }

                return "";
            } catch (e) { return ""; }
        }

        function parseCSV(text) {
            const rows = []; let row = []; let col = ''; let inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                let char = text[i];
                if (char === '"') inQuotes = !inQuotes;
                else if (char === ',' && !inQuotes) { row.push(col); col = ''; }
                else if ((char === '\r' || char === '\n') && !inQuotes) {
                    if (col || row.length > 0) { row.push(col); rows.push(row); row = []; col = ''; }
                } else col += char;
            }
            if (col || row.length > 0) { row.push(col); rows.push(row); }
            return rows;
        }

        function renderPage(pageIndex) {
            const container = document.getElementById('course-grid');
            const indicatorsContainer = document.getElementById('indicators');
            const status = document.getElementById('status-msg');

            if (allCourses.length === 0) {
                container.innerHTML = "";
                indicatorsContainer.innerHTML = "";
                status.style.display = "block";
                status.innerText = `No hay cursos programados para los próximos ${diasMaximosVista} días.`;
                return;
            }

            status.style.display = "none";

            const start = pageIndex * cursosPorPagina;
            const end = start + cursosPorPagina;
            const cursosPagina = allCourses.slice(start, end);

            let htmlContent = '';
            const meses = ['ENE', 'FEB', 'MAR', 'ABR', 'MAY', 'JUN', 'JUL', 'AGO', 'SEP', 'OCT', 'NOV', 'DIC'];

            cursosPagina.forEach((columns, indexInPage) => {
                const globalIndex = start + indexInPage;
                const categoria = columns[0]?.trim() || 'General';
                const titulo = columns[1]?.trim();
                const fechasArr = (columns[2] || '').split(',').map(f => f.trim()).filter(f => f !== "");
                const horasArr = (columns[3] || '').split(',').map(h => h.trim());
                const lugar = columns[4] || 'Por definir';
                const asistentes = (columns[5] || '').split(',').filter(a => a.trim() !== "");
                
                // Mantiene tu regla de marcar el último elemento cargado del Excel como "Nuevo"
                const esNuevo = (globalIndex === allCourses.length - 1);
                const etiquetaDiaHtml = fechasArr.length > 0 ? obtenerEtiquetaDia(fechasArr[0]) : "";

                let sessionsHtml = '';
                const sesionesAgrupadas = [];
                fechasArr.forEach((f, i) => {
                    const hora = horasArr[i] || '--:--';
                    let grupo = sesionesAgrupadas.find(s => s.hora === hora);
                    if (!grupo) {
                        grupo = { hora: hora, fechas: [] };
                        sesionesAgrupadas.push(grupo);
                    }
                    grupo.fechas.push(f);
                });

                sesionesAgrupadas.forEach(grupo => {
                    const diasPorMes = {};
                    grupo.fechas.forEach(f => {
                        const p = f.split('/');
                        const mesNombre = meses[parseInt(p[1]) - 1] || 'DÍA';
                        if (!diasPorMes[mesNombre]) diasPorMes[mesNombre] = [];
                        diasPorMes[mesNombre].push(p[0]);
                    });

                    let iconosCalendario = '';
                    for (const [mes, dias] of Object.entries(diasPorMes)) {
                        iconosCalendario += `
                            <div class="calendar-icon">
                                <span class="cal-month">${mes}</span>
                                <span class="cal-day">${dias.join(', ')}</span>
                            </div>`;
                    }

                    sessionsHtml += `
                        <div class="session-group">
                            <div class="session-box box-left">
                                <div style="display: flex; gap: 12px;">
                                    ${iconosCalendario}
                                </div>
                            </div>
                            <div class="session-box box-right">
                                <div class="time-info"><div class="value">${grupo.hora}</div></div>
                            </div>
                        </div>`;
                });

                let badgesBlock = '';
                if (esNuevo || etiquetaDiaHtml) {
                    badgesBlock = `
                        <div class="badges-wrapper">
                            ${etiquetaDiaHtml}
                            ${esNuevo ? '<div class="badge-item new-badge">Nuevo</div>' : ''}
                        </div>`;
                }

                htmlContent += `
                    <div class="course-card ${esNuevo ? 'new-highlight' : ''}">
                        ${badgesBlock}
                        <div class="card-left">
                            <span class="category-label">${categoria}</span>
                            <h2 class="course-title">${titulo}</h2>
                            <div class="sessions-wrapper">${sessionsHtml}</div>
                        </div>
                        <div class="card-right">
                            <div class="right-label">UBICACIÓN</div>
                            <div class="location-box">${lugar}</div>
                            <div class="right-label">CONVOCADOS</div>
                            <div>${asistentes.map(a => `<span class="attendee-tag">${a.trim()}</span>`).join('')}</div>
                        </div>
                    </div>`;
            });

            // Reemplazo directo en DOM (Corte instantáneo ideal para 24Hz)
            container.innerHTML = htmlContent;

            // Generación de puntos indicadores estáticos (Siempre visibles si hay cursos)
            const totalPages = Math.ceil(allCourses.length / cursosPorPagina);
            let dotsHtml = '';
            if (totalPages > 0) {
                for (let i = 0; i < totalPages; i++) {
                    dotsHtml += `<div class="dot ${i === pageIndex ? 'active' : ''}"></div>`;
                }
            }
            indicatorsContainer.innerHTML = dotsHtml;
        }

        function startRotation() {
            if (rotationInterval) clearInterval(rotationInterval);
            rotationInterval = setInterval(() => {
                const totalPages = Math.ceil(allCourses.length / cursosPorPagina);
                if (totalPages > 1) {
                    currentPage = (currentPage + 1) % totalPages;
                    renderPage(currentPage);
                } else {
                    currentPage = 0;
                }
            }, segundosPorPagina * 1000);
        }

        async function loadCursos() {
            try {
                const response = await fetch(`${url}&t=${Date.now()}`);
                const csvRaw = await response.text();
                
                if (!csvRaw || csvRaw.length < 50) return;

                const data = parseCSV(csvRaw);
                let cursosExcel = data;
                if (data.length > 0 && data[0][0].toLowerCase().includes('cat')) {
                    cursosExcel = data.slice(1);
                }

                // Filtrado dinámico usando la variable superior "diasMaximosVista"
                const cursosFiltrados = cursosExcel.filter(columns => {
                    if (columns.length < 2 || !columns[1]?.trim()) return false;
                    const fechasArr = (columns[2] || '').split(',').map(f => f.trim()).filter(f => f !== "");
                    if (fechasArr.length === 0) return false;

                    const primeraFecha = fechasArr[0];
                    const ultimaFecha = fechasArr[fechasArr.length - 1];
                    
                    if (ultimaFecha && cursoYaTermino(ultimaFecha)) return false;

                    // Filtro dinámico de días vista
                    const fechaInicio = obtenerFechaObjeto(primeraFecha);
                    const limiteDias = new Date();
                    limiteDias.setDate(limiteDias.getDate() + diasMaximosVista);
                    limiteDias.setHours(23, 59, 59, 999);

                    return fechaInicio <= limiteDias;
                });

                // Ordenación cronológica
                cursosFiltrados.sort((a, b) => {
                    const fechaA = (a[2] || '').split(',')[0].trim();
                    const fechaB = (b[2] || '').split(',')[0].trim();
                    return obtenerFechaObjeto(fechaA) - obtenerFechaObjeto(fechaB);
                });

                const newSnapshot = JSON.stringify(cursosFiltrados);

                if (newSnapshot !== currentSnapshot) {
                    currentSnapshot = newSnapshot;
                    allCourses = cursosFiltrados;
                    currentPage = 0; 
                    renderPage(currentPage);
                    startRotation();
                }
            } catch (e) {
                console.error("Error cargando datos:", e);
            }
        }

        loadCursos();
        setInterval(loadCursos, 45000); 
    </script>
</body>
</html>
